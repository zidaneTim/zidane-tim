<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="800" fill="#ffffff"/>
  <rect x="0" y="0" width="600" height="130" fill="#0b3d91"/>
  <text x="300" y="55" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#ffffff" text-anchor="middle">CCAS de Loudéac</text>
  <text x="300" y="95" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#ffffff" text-anchor="middle">L'illectronisme, on en parle</text>

  <text x="300" y="230" font-family="Arial, sans-serif" font-weight="bold" font-size="90" fill="#0b0b0b" text-anchor="middle">62%</text>
  <text x="300" y="280" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0b0b0b" text-anchor="middle">des 75 ans et plus</text>

  <text x="300" y="330" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#0b3d91" text-anchor="middle">contre 2 % des 15-24 ans</text>

  <rect x="60" y="370" width="480" height="2" fill="#0b3d91"/>

  <text x="300" y="430" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0b0b0b" text-anchor="middle">sont en situation</text>
  <text x="300" y="468" font-family="Arial, sans-serif" font-weight="bold" font-size="24" fill="#0b0b0b" text-anchor="middle">d'illectronisme en France</text>

  <rect x="60" y="510" width="480" height="150" rx="12" fill="#eef3fc" stroke="#0b3d91" stroke-width="2"/>
  <text x="300" y="555" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#0b3d91" text-anchor="middle">Ce sont peut-être les personnes</text>
  <text x="300" y="585" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#0b3d91" text-anchor="middle">que tu aideras demain</text>
  <text x="300" y="620" font-family="Arial, sans-serif" font-size="16" fill="#0b0b0b" text-anchor="middle">qui n'y arrivent pas seules aujourd'hui</text>

  <text x="300" y="700" font-family="Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle">15,4 % de la population de 15 ans ou plus en France</text>
  <text x="300" y="760" font-family="Arial, sans-serif" font-size="13" fill="#555555" text-anchor="middle">Source : Insee, Insee Première n°1953, juin 2023</text>
</svg>
